      state.chatClientPhone = phone.trim();
      state.enrollOpen = false;
      state.enrollPayMethod = "flooz";
      state.formationTab = "mesformations";
      showToast(isFree ? "Inscription gratuite confirmée ! 🎉" : "Inscription confirmée !");
      render();

      if (isFree) return;

      if (isCash) {
        var enrollFeeNetwork = state.cashFeeNetwork || "flooz";
        triggerPayGatePayment("fee-" + enrollmentId, phone.trim(), fee, "Frais de service Woezon " + enrollmentId, enrollFeeNetwork, "enrollment", "fee").then(function (payData) {
          if (String(payData.status) === "0") {
            showToast("📱 Vérifie ton téléphone pour valider les frais de service " + enrollFeeNetwork.toUpperCase());
          } else {
            showToast("Erreur lors du paiement des frais de service");
          }
        }).catch(function (e) {
          console.error(e);
          showToast("Erreur lors du paiement des frais de service");
        });
        return;
      }
      triggerPayGatePayment(enrollmentId, phone.trim(), price + fee, "Formation Woezon " + enrollmentId, payMethod, "enrollment").then(function (payData) {
        if (String(payData.status) === "0") {
          showToast("📱 Vérifie ton téléphone pour valider le paiement " + payMethod.toUpperCase());
        } else {
          showToast("Erreur de paiement : réessaie ou choisis un autre mode");
        }
      }).catch(function (e) {
        console.error(e);
        showToast("Erreur lors du lancement du paiement, réessaie");
      });
    }).catch(function (e) {
      console.error(e);
      showToast("Erreur lors de l'inscription, réessaie");
      render();
    });
  }

  function doSubmitReview() {
    if (!state.currentClientAccountId) { showToast("Connecte-toi d'abord"); return; }
    if (!supabaseClient) { showToast("Connexion au serveur indisponible — réessaie plus tard"); return; }
    var commentEl = document.getElementById("review-comment");
    var comment = commentEl ? commentEl.value.trim() : "";
    var account = accountById(state.currentClientAccountId);
    var review = {
      id: "rev" + Date.now(),
      orderId: state.reviewOrderId,
      vendorId: state.reviewVendorId,
      buyerName: account ? account.name : "Client",
      rating: state.reviewRating || 5,
      comment: comment,
      at: new Date().toISOString()
    };
    supabaseClient.from("reviews").insert({
      id: review.id, order_id: review.orderId, vendor_id: review.vendorId,
      client_name: review.buyerName, rating: review.rating, text: review.comment
    }).then(function (res) {
      if (res.error) throw res.error;
      state.data.reviews.push(review);
      state.reviewOpen = false;
      showToast("Merci pour ton avis !");
      render();
    }).catch(function (e) {
      console.error(e);
      showToast("Erreur : impossible d'envoyer l'avis");
      render();
    });
  }

  function openOrCreateChat(kind, peerId) {
    state.chatRole = "client";
    if (!state.currentClientAccountId) {
      showToast("Connecte-toi d'abord pour discuter");
      return;
    }
    var account = accountById(state.currentClientAccountId);
    if (!account) { showToast("Connecte-toi d'abord pour discuter"); return; }
    state.chatClientName = account.name;
    state.chatClientPhone = account.phone;

    var existing = kind === "trainer"
      ? state.data.chats.filter(function (c) { return c.kind === "trainer" && c.trainerId === peerId && c.clientId === account.id; })[0]
      : state.data.chats.filter(function (c) { return c.kind !== "trainer" && c.vendorId === peerId && c.clientId === account.id; })[0];

    if (existing) {
      state.activeChatId = existing.id;
      state.chatOpen = true;
      render();
      return;
    }

    if (!supabaseClient) { showToast("Connexion au serveur indisponible — réessaie plus tard"); return; }
    var chatId = "chat" + Date.now();
    var chatRow = {
      id: chatId, kind: kind, vendor_id: kind === "trainer" ? null : peerId, trainer_id: kind === "trainer" ? peerId : null,
      client_id: account.id, client_name: account.name, client_phone: account.phone
    };
    supabaseClient.from("chats").insert(chatRow).then(function (res) {
      if (res.error) throw res.error;
      var chat = {
        id: chatId, kind: kind, vendorId: chatRow.vendor_id, trainerId: chatRow.trainer_id,
        clientId: account.id, clientName: account.name, clientPhone: account.phone, messages: []
      };
      state.data.chats.push(chat);
      state.activeChatId = chatId;
      state.chatOpen = true;
      render();
    }).catch(function (e) {
      console.error(e);
      showToast("Erreur : impossible d'ouvrir la discussion");
      render();
    });
  }

  function openVendorChat(vendorId) { openOrCreateChat("vendor", vendorId); }
  function openTrainerChat(trainerId) { openOrCreateChat("trainer", trainerId); }

  function doCreateGroup(courseId) {
    var course = state.data.courses.filter(function (c) { return c.id === courseId; })[0];
    if (!course) return;
    var existing = groupForCourse(courseId);
    if (existing) { showToast("Ce groupe existe déjà"); return; }
    if (!supabaseClient) { showToast("Connexion au serveur indisponible — réessaie plus tard"); return; }
    var groupId = "grp" + Date.now();
    supabaseClient.from("groups").insert({ id: groupId, course_id: courseId }).then(function (res) {
      if (res.error) throw res.error;
      var group = {
        id: groupId, courseId: courseId, trainerId: course.trainerId,
        name: "Groupe · " + course.title, messages: []
      };
      state.data.groups.push(group);
      showToast("Groupe créé");
      state.activeGroupId = group.id;
      state.groupOpen = true;
      state.groupSenderRole = "formateur";
      state.groupSenderName = (trainerById(state.currentTrainerId) || {}).name || "Formateur";
      render();
    }).catch(function (e) {
      console.error(e);
      showToast("Erreur : impossible de créer le groupe");
      render();
    });
  }

  function doSendGroupMessage() {
    var input = document.getElementById("group-input");
    if (!input) return;
    var text = input.value.trim();
    if (!text || !state.activeGroupId) return;
    var group = groupById(state.activeGroupId);
    if (!group) return;
    if (!supabaseClient) { showToast("Connexion au serveur indisponible"); return; }
    var message = { senderRole: state.groupSenderRole, senderName: state.groupSenderName, text: text, at: new Date().toISOString() };
    input.value = "";
    group.messages.push(message);
    render();
    supabaseClient.from("group_messages").insert({
      id: "gm" + Date.now(), group_id: group.id, sender_role: message.senderRole, sender_name: message.senderName,
      text: message.text, message_type: "text"
    }).then(function (res) {
      if (res.error) { console.error(res.error); showToast("Erreur d'envoi du message"); }
    });
  }

  function doStartChat() {
    if (!state.currentClientAccountId) { showToast("Connecte-toi d'abord pour discuter"); return; }
    var peerId = state.chatPendingVendorId;
    var kind = state.chatPendingKind === "trainer" ? "trainer" : "vendor";
    openOrCreateChat(kind, peerId);
  }

  function doSendChat() {
    var input = document.getElementById("chat-input");
    if (!input) return;
    var text = input.value.trim();
    if (!text || !state.activeChatId) return;
    var chat = chatById(state.activeChatId);
    if (!chat) return;
    if (!supabaseClient) { showToast("Connexion au serveur indisponible — réessaie plus tard"); return; }
    var message = { from: state.chatRole, text: text, at: new Date().toISOString() };
    input.value = "";
    chat.messages.push(message);
    render();
    supabaseClient.from("chat_messages").insert({
      id: "msg" + Date.now(), chat_id: chat.id, from_role: message.from, text: message.text, message_type: "text"
    }).then(function (res) {
      if (res.error) { console.error(res.error); showToast("Erreur d'envoi du message"); }
    });
  }

  var MAX_FILE_SIZE = 4 * 1024 * 1024; // 4 Mo, limite raisonnable pour le stockage du navigateur

  function triggerFilePick(target) {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.zip";
    input.style.display = "none";
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (file) handleFileSelected(target, file);
      document.body.removeChild(input);
    });
    document.body.appendChild(input);
    input.click();
  }

  function handleFileSelected(target, file) {
    if (file.size > MAX_FILE_SIZE) {
      showToast("Fichier trop volumineux (max " + humanFileSize(MAX_FILE_SIZE) + ")");
      return;
    }
    var type = "file";
    if (file.type.indexOf("image/") === 0) type = "image";
    else if (file.type.indexOf("video/") === 0) type = "video";

    var reader = new FileReader();
    reader.onload = function () {
      var payload = { type: type, fileData: reader.result, fileName: file.name, fileSize: file.size, at: new Date().toISOString() };
      if (target === "group") {
        if (!state.activeGroupId) return;
        var group = groupById(state.activeGroupId);
        if (!group) return;
        group.messages.push(Object.assign({ senderRole: state.groupSenderRole, senderName: state.groupSenderName }, payload));
      } else {
        if (!state.activeChatId) return;
        var chat = chatById(state.activeChatId);
        if (!chat) return;
        chat.messages.push(Object.assign({ from: state.chatRole }, payload));
      }
      saveData(state.data);
      render();
    };
    reader.onerror = function () { showToast("Impossible de lire ce fichier"); };
    reader.readAsDataURL(file);
  }

  function toggleRecording() {
    if (state.recording) {
      stopRecording();
    } else {
      startRecording();
    }
  }

  function startRecording() {
    if (!state.activeChatId && !state.activeGroupId) { showToast("Ouvre une discussion d'abord"); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      showToast("Micro non disponible sur ce navigateur");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mimeType = "audio/webm";
      try {
        if (MediaRecorder.isTypeSupported && !MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = "";
        }
      } catch (e) { mimeType = ""; }
      var recorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
      state.mediaRecorder = recorder;
      state.audioChunks = [];
      recorder.addEventListener("dataavailable", function (e) {
        if (e.data && e.data.size > 0) state.audioChunks.push(e.data);
      });
      recorder.addEventListener("stop", function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        var blob = new Blob(state.audioChunks, { type: recorder.mimeType || "audio/webm" });
        var reader = new FileReader();
        reader.onload = function () {
          if (state.activeGroupId) {
            var group = groupById(state.activeGroupId);
            if (group) {
              group.messages.push({ senderRole: state.groupSenderRole, senderName: state.groupSenderName, type: "audio", audioData: reader.result, at: new Date().toISOString() });
              saveData(state.data);
            }
          } else {
            var chat = chatById(state.activeChatId);
            if (chat) {
              chat.messages.push({ from: state.chatRole, type: "audio", audioData: reader.result, at: new Date().toISOString() });
              saveData(state.data);
            }
          }
          state.recording = false;
          render();
        };
        reader.readAsDataURL(blob);
      });
      recorder.start();
      state.recording = true;
      render();
    }).catch(function () {
      showToast("Accès au micro refusé ou indisponible (nécessite une connexion sécurisée https)");
    });
  }

  function stopRecording() {
    if (state.mediaRecorder && state.mediaRecorder.state !== "inactive") {
      state.mediaRecorder.stop();
    } else {
      state.recording = false;
      render();
    }
  }

  function doRequestDelivery() {
    var name = (document.getElementById("dl-name") || {}).value || "";
    var phone = (document.getElementById("dl-phone") || {}).value || "";
    var pickup = (document.getElementById("dl-pickup") || {}).value || "";
    var dropoff = (document.getElementById("dl-dropoff") || {}).value || "";
    var note = (document.getElementById("dl-note") || {}).value || "";
    if (!name.trim() || !phone.trim() || !pickup.trim() || !dropoff.trim()) { showToast("Remplis les champs obligatoires"); return; }
    if (!supabaseClient) { showToast("Connexion au serveur indisponible — réessaie plus tard"); return; }
    var selectedCourier = state.selectedCourierId ? state.data.couriers.filter(function (c) { return c.id === state.selectedCourierId; })[0] : null;
    var reqId = "r" + Date.now();
    var reqRow = {
      id: reqId, name: name.trim(), phone: phone.trim(), pickup: pickup.trim(), dropoff: dropoff.trim(),
      note: note.trim(), status: selectedCourier ? "assignee" : "attente",
      courier_id: selectedCourier ? selectedCourier.id : null
    };
    supabaseClient.from("delivery_requests").insert(reqRow).then(function (res) {
      if (res.error) throw res.error;
      var req = {
        id: reqId, name: reqRow.name, phone: reqRow.phone, pickup: reqRow.pickup, dropoff: reqRow.dropoff,
        note: reqRow.note, status: reqRow.status, createdAt: new Date().toISOString(),
        courierId: reqRow.courier_id, courierName: selectedCourier ? selectedCourier.name : null
      };
      state.data.deliveryRequests.push(req);
      state.newReqName = ""; state.newReqPhone = ""; state.newReqPickup = ""; state.newReqDropoff = ""; state.newReqNote = "";
      state.selectedCourierId = null;
      showToast(selectedCourier ? "Demande envoyée à " + selectedCourier.name : "Demande envoyée aux livreurs");
      render();
    }).catch(function (e) {
      console.error(e);
      showToast("Erreur lors de l'envoi de la demande");
      render();
    });
  }

  // ---------- boot ----------
  document.addEventListener("click", function (e) {
    if (!state.menuOpen) return;
    if (e.target.closest && (e.target.closest(".nav-menu") || e.target.closest(".menu-btn"))) return;
    state.menuOpen = false;
    render();
  });

  root.innerHTML = '<div style="padding:60px;text-align:center;color:#F3EFE3;background:#0F2A28;min-height:100vh;font-family:sans-serif">Chargement du marché…</div>';
  loadData().then(function (d) {
    state.data = d;
    return restoreSupabaseSession();
  }).then(function () {
    return loadOrdersFromSupabase().then(function (orders) {
      if (orders) state.data.orders = orders;
    });
  }).then(function () {
    return loadChatsFromSupabase().then(function (chats) {
      if (chats) state.data.chats = chats;
    });
  }).then(function () {
    return Promise.all([
      loadDeliveryRequestsFromSupabase(),
      loadEnrollmentsFromSupabase(),
      loadGroupsFromSupabase()
    ]).then(function (results) {
      if (results[0]) state.data.deliveryRequests = results[0];
      if (results[1]) state.data.enrollments = results[1];
      if (results[2]) state.data.groups = results[2];
    });
  }).then(function () {
    render();
    if (notifSupported() && Notification.permission === "granted") {
      startNotifPolling();
    }
  });
})();
</script>
