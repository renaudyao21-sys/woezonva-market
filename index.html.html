<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woezon — Marché en ligne</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 170 170'%3E%3Crect width='170' height='170' rx='38' fill='%230F2A28'/%3E%3Cpath d='M35 64 L57 108 L74 72 L84 108 L94 72 L111 108 L133 64' fill='none' stroke='%23E8A33D' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='123' cy='46' r='7' fill='%23D64545'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    --ink-dark: #0F2A28;
    --ink-dark-2: #143733;
    --surface: #FBF6EC;
    --surface-2: #F3ECDC;
    --text-on-dark: #F3EFE3;
    --text-on-light: #1B2E2A;
    --text-muted: #5C6E69;
    --amber: #E8A33D;
    --amber-deep: #C9821F;
    --coral: #D64545;
    --jade: #4C8C7D;
    --line: rgba(15,42,40,0.12);
    font-family: Georgia, 'Times New Roman', serif, -apple-system, sans-serif;
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-on-light);
    background: var(--ink-dark);
    min-height: 100vh;
  }
  .display { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }

  .topbar {
    background: var(--ink-dark);
    color: var(--text-on-dark);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 30;
    border-bottom: 1px solid rgba(243,239,227,0.1);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    white-space: nowrap;
    border: none; background: none; color: var(--text-on-dark);
  }
  .logo-icon { flex-shrink: 0; }
  .logo-word {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .logo .dot { color: var(--amber); }
  .search {
    flex: 1;
    min-width: 0;
    max-width: 480px;
    display: flex;
    align-items: center;
    background: rgba(243,239,227,0.08);
    border: 1px solid rgba(243,239,227,0.18);
    border-radius: 999px;
    padding: 9px 14px;
    gap: 6px;
  }
  .search input {
    background: none;
    border: none;
    outline: none;
    color: var(--text-on-dark);
    font-family: inherit;
    font-size: 14px;
    width: 100%;
    min-width: 0;
  }
  .search input::placeholder { color: rgba(243,239,227,0.5); }
  .search-icon-btn {
    background: none; border: none; color: rgba(243,239,227,0.75); cursor: pointer;
    font-size: 14px; padding: 0; margin: 0; flex-shrink: 0; line-height: 1; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .mode-toggle {
    display: flex;
    background: rgba(243,239,227,0.08);
    border: 1px solid rgba(243,239,227,0.18);
    border-radius: 999px;
    padding: 3px;
    font-size: 13px;
  }
  .mode-toggle button {
    border: none;
    background: none;
    color: rgba(243,239,227,0.65);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: all .15s;
  }
  .mode-toggle button.active { background: var(--amber); color: var(--ink-dark); }
  .cart-btn {
    position: relative;
    background: var(--amber);
    color: var(--ink-dark);
    border: none;
    border-radius: 999px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 18px;
    flex-shrink: 0;
  }
  .cart-badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--coral); color: white;
    font-size: 11px; font-weight: 700;
    border-radius: 999px; min-width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }
  .topbar-link-btn {
    background: rgba(243,239,227,0.08); border: 1px solid rgba(243,239,227,0.18); color: var(--text-on-dark);
    padding: 9px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .topbar-link-btn:hover { background: rgba(243,239,227,0.16); }
  .menu-btn {
    background: var(--amber); color: var(--ink-dark); border: none;
    padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .nav-menu {
    position: absolute; top: calc(100% + 8px); right: 0; background: var(--surface); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35); padding: 6px; min-width: 210px; z-index: 50;
    display: flex; flex-direction: column; gap: 2px;
  }
  .nav-menu-item {
    background: none; border: none; text-align: left; padding: 10px 12px; border-radius: 8px;
    font-size: 13.5px; font-weight: 600; color: var(--text-on-light); cursor: pointer; font-family: inherit;
  }
  .nav-menu-item:hover { background: var(--surface-2); }
  .nav-menu-item.active { background: var(--ink-dark); color: var(--amber); }
  @media (max-width: 560px) { .menu-btn-label { display: none; } .menu-btn { padding: 9px 12px; } }

  .page { background: var(--ink-dark); padding-bottom: 60px; min-height: calc(100vh - 76px); }
  .section { max-width: 1080px; margin: 0 auto; padding: 36px 20px 0; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 1.6px; font-size: 11.5px;
    font-weight: 700; color: var(--amber); margin-bottom: 8px;
  }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .section-title { font-family: 'Fraunces', Georgia, serif; font-size: 26px; color: var(--text-on-dark); font-weight: 600; }
  .section-sub { color: rgba(243,239,227,0.6); font-size: 14px; margin-top: 4px; }

  .hero { text-align: center; padding: 46px 20px 10px; }
  .hero-badge {
    display: inline-block; background: rgba(232,163,61,0.14); color: var(--amber); border: 1px solid rgba(232,163,61,0.3);
    padding: 6px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 18px;
  }
  .hero-title { font-family: 'Fraunces', Georgia, serif; font-size: 40px; font-weight: 700; color: var(--text-on-dark); line-height: 1.15; }
  .hero-title em { font-style: normal; color: var(--amber); }
  .hero-sub { color: rgba(243,239,227,0.65); font-size: 15px; max-width: 480px; margin: 14px auto 26px; line-height: 1.5; }
  .hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .hero-cta .primary-btn, .hero-cta .secondary-btn { width: auto; padding: 13px 26px; margin: 0; }
  .hero-cta .secondary-btn { border-color: rgba(243,239,227,0.4); color: var(--text-on-dark); }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 700px; margin: 0 auto 46px; }
  @media (max-width: 640px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { text-align: center; }
  .stat-num { font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 700; color: var(--amber); }
  .stat-label { font-size: 12px; color: rgba(243,239,227,0.55); margin-top: 2px; }

  .steps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 780px) { .steps-grid { grid-template-columns: repeat(2, 1fr); } }
  .step-card { background: var(--surface); border-radius: 14px; padding: 20px 18px; }
  .step-num {
    width: 30px; height: 30px; border-radius: 999px; background: var(--ink-dark); color: var(--amber);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; margin-bottom: 12px;
  }
  .step-title { font-weight: 700; font-size: 14.5px; margin-bottom: 4px; }
  .step-text { font-size: 12.5px; color: var(--text-muted); line-height: 1.4; }

  .escrow-banner {
    background: rgba(76,140,125,0.12); border: 1px solid rgba(76,140,125,0.35); border-radius: 12px;
    padding: 12px 16px; font-size: 12.5px; color: var(--jade); display: flex; gap: 10px; align-items: flex-start; margin: 14px 0;
  }
  .price-line { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; color: var(--text-muted); }
  .price-line.total { color: var(--text-on-light); font-weight: 700; font-size: 15px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; }
  .stars { color: var(--amber-deep); letter-spacing: 1px; }
  .review-card { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .review-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .star-picker { font-size: 26px; letter-spacing: 4px; cursor: pointer; margin: 6px 0; }
  .star-picker span { cursor: pointer; }

  /* ---------- Messenger-style chat/group UI ---------- */
  .msgr-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 55;
    display: flex; justify-content: flex-end;
  }
  .msgr-panel {
    width: 420px; max-width: 100vw; height: 100%; background: #FFFFFF;
    display: flex; flex-direction: column; font-family: inherit;
  }
  @media (max-width: 480px) { .msgr-panel { width: 100vw; } }
  .msgr-header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid #ECECEC; flex-shrink: 0; background: #fff;
  }
  .msgr-back {
    background: none; border: none; font-size: 20px; color: #050505; cursor: pointer;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .msgr-avatar {
    width: 38px; height: 38px; border-radius: 999px; background: linear-gradient(135deg, var(--amber), var(--jade));
    color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    flex-shrink: 0; font-family: 'Fraunces', Georgia, serif;
  }
  .msgr-avatar.small { width: 22px; height: 22px; font-size: 9.5px; }
  .msgr-headinfo { flex: 1; min-width: 0; }
  .msgr-name { font-weight: 700; font-size: 15px; color: #050505; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msgr-status { font-size: 12px; color: #65676B; }
  .msgr-iconbtn {
    background: none; border: none; color: #0084FF; font-size: 19px; cursor: pointer;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none;
  }
  .msgr-body {
    flex: 1; overflow-y: auto; padding: 10px 12px; background: #fff;
    display: flex; flex-direction: column;
  }
  .msgr-row { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 2px; max-width: 100%; }
  .msgr-row.mine { flex-direction: row-reverse; }
  .msgr-row.tight { margin-bottom: 1px; }
  .msgr-spacer { width: 22px; flex-shrink: 0; }
  .msgr-bubble-wrap { display: flex; flex-direction: column; max-width: 74%; }
  .msgr-sendername { font-size: 11px; color: #65676B; margin: 6px 0 2px 4px; }
  .msgr-bubble {
    padding: 8px 12px; font-size: 14.5px; line-height: 1.35; word-wrap: break-word;
    border-radius: 18px;
  }
  .msgr-row.mine .msgr-bubble { background: linear-gradient(135deg, #0084FF, #0066CC); color: white; border-bottom-right-radius: 4px; }
  .msgr-row.theirs .msgr-bubble { background: #F0F0F0; color: #050505; border-bottom-left-radius: 4px; }
  .msgr-bubble audio { max-width: 200px; height: 32px; }
  .msgr-bubble img.msgr-media { max-width: 220px; max-height: 260px; border-radius: 12px; display: block; cursor: pointer; }
  .msgr-bubble video.msgr-media { max-width: 220px; max-height: 260px; border-radius: 12px; display: block; }
  .msgr-bubble.media-bubble { padding: 4px; background: none !important; }
  .msgr-file-card {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: rgba(0,0,0,0.06); text-decoration: none; color: inherit; min-width: 180px;
  }
  .msgr-row.mine .msgr-file-card { background: rgba(255,255,255,0.18); }
  .msgr-file-icon { font-size: 22px; flex-shrink: 0; }
  .msgr-file-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .msgr-file-size { font-size: 11px; opacity: 0.75; }
  .msgr-attach-btn {
    background: none; border: none; color: #0084FF; font-size: 21px; cursor: pointer; flex-shrink: 0;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 999px;
  }
  .msgr-lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 70;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .msgr-lightbox img, .msgr-lightbox video { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .msgr-lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); border: none; color: white; width: 38px; height: 38px; border-radius: 999px; font-size: 20px; cursor: pointer; }
  .msgr-empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: #65676B; font-size: 13.5px; padding: 30px; }
  .msgr-inputbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid #ECECEC;
    background: #fff; flex-shrink: 0;
  }
  .msgr-mic-btn {
    background: none; border: none; color: #0084FF; font-size: 21px; cursor: pointer; flex-shrink: 0;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 999px;
  }
  .msgr-mic-btn.recording { background: var(--coral); color: white; }
  .msgr-input-pill {
    flex: 1; min-width: 0; background: #F0F0F0; border-radius: 999px; padding: 9px 14px;
    display: flex; align-items: center;
  }
  .msgr-input-pill input {
    width: 100%; border: none; background: none; outline: none; font-size: 14.5px; font-family: inherit; color: #050505;
  }
  .msgr-send-btn {
    background: none; border: none; color: #0084FF; font-size: 22px; cursor: pointer; flex-shrink: 0;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  }
  .msgr-recording-note { text-align: center; font-size: 11.5px; color: var(--coral); font-weight: 600; padding: 4px 0 8px; background: #fff; }

  .stalls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  @media (max-width: 980px) { .stalls { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .stalls { grid-template-columns: repeat(2, 1fr); } }
  .stall {
    position: relative;
    border: none;
    cursor: pointer;
    padding: 26px 16px 18px;
    border-radius: 4px 4px 10px 10px;
    text-align: left;
    color: var(--ink-dark);
    font-family: inherit;
    overflow: hidden;
    min-height: 108px;
    transition: transform .15s ease;
  }
  .stall:hover { transform: translateY(-3px); }
  .stall::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 16px;
    background-image: linear-gradient(135deg, rgba(0,0,0,0.16) 25%, transparent 25%),
                       linear-gradient(225deg, rgba(0,0,0,0.16) 25%, transparent 25%);
    background-size: 16px 16px;
  }
  .stall-name { font-weight: 700; font-size: 16.5px; margin-top: 6px; }
  .stall-count { font-size: 12.5px; opacity: 0.75; margin-top: 3px; }
  .stall.c1 { background: var(--amber); }
  .stall.c2 { background: #E3B8A5; }
  .stall.c3 { background: var(--jade); color: var(--surface); }
  .stall.c4 { background: #E8C15E; }
  .stall.c3 .stall-count { color: rgba(251,246,236,0.8); }

  .vendor-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
  .vendor-card {
    flex: 0 0 190px; background: var(--surface); border-radius: 14px; padding: 16px;
    cursor: pointer; border: 1px solid transparent;
  }
  .vendor-card:hover { border-color: var(--amber); }
  .vendor-avatar {
    width: 44px; height: 44px; border-radius: 999px; background: var(--ink-dark);
    color: var(--amber); display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 17px; margin-bottom: 10px;
  }
  .vendor-name { font-weight: 700; font-size: 14.5px; }
  .vendor-cat { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .vendor-rating { font-size: 12px; color: var(--amber-deep); margin-top: 8px; font-weight: 600; }

  .products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 860px) { .products { grid-template-columns: repeat(2, 1fr); } }
  .product-card { background: var(--surface); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .product-thumb {
    height: 108px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: rgba(27,46,42,0.35);
  }
  .product-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .product-name { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
  .product-vendor { font-size: 12px; color: var(--text-muted); }
  .product-price { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 17px; margin-top: auto; }
  .add-btn {
    margin-top: 8px; background: var(--ink-dark); color: var(--text-on-dark); border: none;
    border-radius: 999px; padding: 8px 0; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .add-btn:hover { background: var(--ink-dark-2); }

  .empty { background: var(--surface); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--text-muted); }
  .empty .display { font-size: 19px; color: var(--text-on-light); margin-bottom: 6px; }

  .crumb { color: rgba(243,239,227,0.7); font-size: 13px; margin-bottom: 10px; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
  .crumb:hover { color: var(--amber); }

  .overlay {
    position: fixed; inset: 0; background: rgba(15,42,40,0.55); z-index: 40;
    display: flex; justify-content: flex-end;
  }
  .drawer {
    width: 380px; max-width: 92vw; background: var(--surface); height: 100%;
    padding: 22px; overflow-y: auto; display: flex; flex-direction: column;
  }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .drawer-title { font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 700; }
  .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-on-light); }
  .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .cart-item-thumb { width: 46px; height: 46px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-weight: 700; font-size: 13.5px; }
  .cart-item-vendor { font-size: 11.5px; color: var(--text-muted); }
  .qty-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .qty-btn {
    width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--line); background: white;
    cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: inherit;
  }
  .cart-item-price { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
  .cart-total-row { display: flex; justify-content: space-between; padding: 16px 0; font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); margin-top: 6px; }
  .primary-btn {
    background: var(--coral); color: white; border: none; border-radius: 999px; padding: 13px; font-weight: 700; font-size: 14.5px;
    cursor: pointer; width: 100%; margin-top: 8px; font-family: inherit;
  }
  .primary-btn:hover { background: #b83737; }
  .primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .secondary-btn {
    background: none; color: var(--ink-dark); border: 1.5px solid var(--ink-dark); border-radius: 999px; padding: 11px;
    font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; font-family: inherit;
  }

  .field-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
  .field-input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 14px;
    font-family: inherit; outline: none; background: white;
  }
  .field-input:focus { border-color: var(--amber-deep); }

      for (var r = 8; r < _moduleCount - 8; r += 1) {

          + '>'
          + totalDataCount * 8
          + ')';

        break;
      case 'Kanji' :

          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      var max = size - margin;

      return createDataURL(size, size, function(x, y) {

      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {

        img += escapeXml(alt);
        img += '"';

    var escapeXml = function(s) {
      var escaped = '';

        case '>': escaped += '&gt;'; break;

  // ---------- persistence (uses window.storage if available, else localStorage fallback) ----------
  function hasArtifactStorage() {
    return typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function";
  }

  function loadData() {
    return new Promise(function (resolve) {
      if (hasArtifactStorage()) {
        window.storage.get(STORAGE_KEY, true).then(function (res) {
          if (res && res.value) {
            try { resolve(normalizeData(JSON.parse(res.value))); return; } catch (e) {}
          }
          var initial = { vendors: SEED_VENDORS, products: SEED_PRODUCTS, orders: [], couriers: SEED_COURIERS, deliveryRequests: [], chats: [], reviews: [], trainers: SEED_TRAINERS, courses: SEED_COURSES, enrollments: [], accounts: SEED_ACCOUNTS, groups: [] };
          window.storage.set(STORAGE_KEY, JSON.stringify(initial), true).catch(function () {});
          resolve(initial);
        }).catch(function () {
          resolve(normalizeData(loadFromLocalStorage()));
        });
      } else {
        resolve(normalizeData(loadFromLocalStorage()));
      }
    }).then(function (data) {
      // On complète/remplace le catalogue (boutiques, produits,
      // livreurs, formateurs, formations) avec les vraies données
      // Supabase, si la connexion fonctionne. Le reste (commandes,
      // comptes, chats...) n'est pas encore migré.
      return loadCatalogFromSupabase().then(function (catalog) {
        if (catalog) {
          data.vendors = catalog.vendors;
          data.products = catalog.products;
          data.couriers = catalog.couriers;
          data.trainers = catalog.trainers;
          data.courses = catalog.courses;
        } else {
          console.warn("Connexion Supabase indisponible — utilisation des données de secours locales pour le catalogue.");
        }
        return data;
      });
    });
  }

  function normalizeData(d) {
    if (!d.couriers) d.couriers = SEED_COURIERS;
    if (!d.deliveryRequests) d.deliveryRequests = [];
    if (!d.chats) d.chats = [];
    if (!d.reviews) d.reviews = [];
    if (!d.trainers) d.trainers = SEED_TRAINERS;
    if (!d.courses) d.courses = SEED_COURSES;
    if (!d.enrollments) d.enrollments = [];
    if (!d.accounts) d.accounts = SEED_ACCOUNTS;
    if (!d.groups) d.groups = [];
    return d;
  }

  function loadFromLocalStorage() {
    try {
      var raw = window.localStorage.getItem(LOCAL_FALLBACK_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { vendors: SEED_VENDORS, products: SEED_PRODUCTS, orders: [], couriers: SEED_COURIERS, deliveryRequests: [], chats: [], reviews: [], trainers: SEED_TRAINERS, courses: SEED_COURSES, enrollments: [], accounts: SEED_ACCOUNTS, groups: [] };
  }

  function saveData(data) {
    if (hasArtifactStorage()) {
      window.storage.set(STORAGE_KEY, JSON.stringify(data), true).catch(function () {});
    }
    try { window.localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(data)); } catch (e) {}
  }

        '<input id="search-input" placeholder="Chercher…" value="' + escapeHtml(state.query) + '">' +
      '</div>' +
      '<div class="topbar-actions">' +
        '<div style="position:relative">' +
          '<button class="menu-btn" data-action="toggle-menu">☰ <span class="menu-btn-label">Menu</span></button>' +
          menuHtml +
        '</div>' +
        (state.mode === "acheteur" ? (
          '<button class="cart-btn" data-action="open-cart">🧺' +
          (cartCount > 0 ? '<span class="cart-badge">' + cartCount + '</span>' : '') +
          '</button>'
        ) : '') +
      '</div>' +
    '</div>';
  }

  function renderStall(cat) {
    var count = state.data.products.filter(function (p) { return p.category === cat.id; }).length;
    return '' +
    '<button class="stall ' + cat.cls + '" data-action="open-category" data-cat="' + cat.id + '">' +
      '<div style="font-size:26px">' + cat.icon + '</div>' +
      '<div class="stall-name">' + escapeHtml(cat.label) + '</div>' +
      '<div class="stall-count">' + count + ' article' + (count > 1 ? "s" : "") + '</div>' +
    '</button>';
  }

  function renderVendorCard(v) {
    var reviews = state.data.reviews.filter(function (r) { return r.vendorId === v.id; });
    var ratingDisplay = v.rating;
    if (reviews.length > 0) {
      ratingDisplay = (reviews.reduce(function (s, r) { return s + r.rating; }, 0) / reviews.length).toFixed(1);
    }
    return '' +
    '<div class="vendor-card" data-action="open-vendor" data-vendor="' + v.id + '">' +
      '<div class="vendor-avatar">' + initials(v.name) + '</div>' +
      '<div class="vendor-name">' + escapeHtml(v.name) + '</div>' +
      '<div class="vendor-cat">' + escapeHtml(catLabel(v.category)) + '</div>' +
      '<div class="vendor-rating">★ ' + ratingDisplay + '</div>' +
    '</div>';
  }

  function renderProductCard(p) {
    var v = vendorById(p.vendorId);
    return '' +
    '<div class="product-card">' +
      '<div class="product-thumb">' + p.icon + '</div>' +
      '<div class="product-body">' +
        '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="product-vendor">' + (v ? escapeHtml(v.name) : "") + '</div>' +
        '<div class="product-price">' + fmt(p.price) + '</div>' +
        '<button class="add-btn" data-action="add-cart" data-product="' + p.id + '">Ajouter au panier</button>' +
      '</div>' +
    '</div>';
  }

  function currentProductList() {
    var list = state.data.products;
    if (state.view.screen === "category") list = list.filter(function (p) { return p.category === state.view.categoryId; });
    if (state.view.screen === "vendor") list = list.filter(function (p) { return p.vendorId === state.view.vendorId; });
    if (state.view.screen === "search" && state.query.trim()) {
      var q = state.query.trim().toLowerCase();
      list = list.filter(function (p) { return p.name.toLowerCase().indexOf(q) !== -1; });
    }
    return list;
  }

  function renderBuyerScreens() {
    var v = state.view;
    if (v.screen === "home") {
      var stallsHtml = CATEGORIES.map(renderStall).join("");
      var vendorsHtml = state.data.vendors.map(renderVendorCard).join("");
      var vendorsCount = state.data.vendors.length;
      var listingsCount = state.data.products.length;
      var avgSatisfaction = "98%";
      if (state.data.reviews.length > 0) {
        var avg = state.data.reviews.reduce(function (s, r) { return s + r.rating; }, 0) / state.data.reviews.length;
        avgSatisfaction = Math.round(avg / 5 * 100) + "%";
      }

      var stepsHtml = [
        { n: 1, title: "Inscris-toi", text: "Crée ton compte gratuitement en 2 minutes." },
        { n: 2, title: "Trouve ou publie", text: "Parcours les annonces ou publie la tienne." },
        { n: 3, title: "Paye en sécurité", text: "L'argent est bloqué jusqu'à confirmation de livraison." },
        { n: 4, title: "Note & profite", text: "Laisse un avis pour la communauté." }
      ].map(function (s) {
        return '<div class="step-card"><div class="step-num">' + s.n + '</div><div class="step-title">' + s.title + '</div><div class="step-text">' + s.text + '</div></div>';
      }).join("");

      return '' +
      '<div class="hero">' +
        '<div class="hero-badge">🇹🇬 MARKETPLACE #1 AU TOGO</div>' +
        '<div class="hero-title">Achète. Vends.<br><em>Grandis ensemble.</em></div>' +
        '<div class="hero-sub">Produits, services et articles physiques — paiement sécurisé Flooz, TMoney, carte ou virement. L\'argent est bloqué jusqu\'à ta confirmation de livraison.</div>' +
        '<div class="hero-cta">' +
          '<button class="primary-btn" data-action="scroll-stalls">Voir les annonces</button>' +
          '<button class="secondary-btn" data-action="set-mode" data-mode="vendeur">Devenir vendeur →</button>' +
        '</div>' +
        '<div class="stats-row">' +
          '<div class="stat-card"><div class="stat-num">' + vendorsCount + '+</div><div class="stat-label">Vendeurs</div></div>' +
          '<div class="stat-card"><div class="stat-num">' + listingsCount + '+</div><div class="stat-label">Annonces</div></div>' +
          '<div class="stat-card"><div class="stat-num">' + avgSatisfaction + '</div><div class="stat-label">Satisfaction</div></div>' +
          '<div class="stat-card"><div class="stat-num">0 F</div><div class="stat-label">Inscription</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="section" id="stalls-anchor">' +
        '<div class="eyebrow">Le marché aujourd\'hui</div>' +
        '<div class="section-title" style="margin-bottom:18px">Explore par catégorie</div>' +
        '<div class="stalls">' + stallsHtml + '</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head">' +
          '<div>' +
            '<div class="section-title">Vendeurs à la une</div>' +
            '<div class="section-sub">Des commerçants et prestataires qui vendent en ce moment</div>' +
          '</div>' +
        '</div>' +
        '<div class="vendor-row">' + vendorsHtml + '</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="eyebrow">Comment ça marche ?</div>' +
        '<div class="section-title" style="margin-bottom:18px">Simple, rapide et sécurisé</div>' +
        '<div class="steps-grid">' + stepsHtml + '</div>' +
      '</div>';
    }

    if (v.screen === "category" || v.screen === "vendor" || v.screen === "search") {
      var title = "";
      var contactBtn = "";
      var reviewsSection = "";
      if (v.screen === "category") title = catLabel(v.categoryId);
      if (v.screen === "vendor") {
        var vv = vendorById(v.vendorId);
        title = vv ? vv.name : "";
        contactBtn = '<button class="secondary-btn" style="width:auto;padding:9px 18px;margin:0 0 18px" data-action="open-vendor-chat" data-vendor="' + v.vendorId + '">💬 Contacter ce vendeur</button>';
        reviewsSection = renderVendorReviews(v.vendorId);
      }
      if (v.screen === "search") title = "Résultats pour « " + escapeHtml(state.query) + " »";
      var list = currentProductList();
      var body = list.length === 0
        ? '<div class="empty"><div class="display">Rien à afficher ici</div>Essaie un autre stand ou un autre mot-clé.</div>'
        : '<div class="products">' + list.map(renderProductCard).join("") + '</div>';
      return '' +
      '<div class="section">' +
        '<button class="crumb" data-action="go-home">← Retour au marché</button>' +
        '<div class="section-title" style="margin-bottom:18px">' + escapeHtml(title) + '</div>' +
        contactBtn +
        body +
        reviewsSection +
      '</div>';
    }

    if (v.screen === "checkout") {
      return renderCheckout();
    }

    if (v.screen === "confirmation") {
      var o = v.order;
      return '' +
      '<div class="section" style="max-width:480px">' +
        '<div class="empty" style="background:var(--surface)">' +
          '<div class="display" style="font-size:22px">Commande envoyée 🎉</div>' +
          '<p style="margin:10px 0">Merci ' + escapeHtml(o.name) + ', ta commande de ' + fmt(o.total) + ' a bien été transmise aux vendeurs. Ils te contactent au ' + escapeHtml(o.phone) + ' pour la livraison.</p>' +
          '<button class="secondary-btn" data-action="go-home">Retour au marché</button>' +
        '</div>' +
      '</div>';
    }

    if (v.screen === "myorders") {
      return renderMyOrders();
    }

    return "";
  }

  function renderMyOrders() {
    if (!state.currentClientAccountId) {
      return renderAuthGate("client");
    }
    var account = accountById(state.currentClientAccountId);
    if (!account) { state.currentClientAccountId = null; return renderAuthGate("client"); }
    var matches = state.data.orders.filter(function (o) { return o.clientId === account.id; });

    var listHtml = "";
    if (matches.length === 0) {
      listHtml = '<div class="empty"><div class="display">Aucune commande pour l\'instant</div>Tes commandes apparaîtront ici après ton premier achat.</div>';
    } else if (matches.length > 0) {
      listHtml = matches.slice().reverse().map(function (o) {
        var statusCls = o.status === "livree" ? "livree" : (o.status === "confirmee" ? "confirmee" : "attente");
        var statusLabel = o.status === "livree" ? "Livrée" : (o.status === "confirmee" ? "Confirmée" : "En attente");
        var itemsTxt = o.items.map(function (it) { return it.qty + "× " + it.name; }).join(", ");
        var payLabel = o.paymentStatus === "bloque" ? "🔒 Fonds bloqués" : (o.paymentStatus === "libere" ? "✅ Fonds libérés au vendeur" : (o.paymentStatus === "recu" ? "💵 Payé à la livraison" : "💵 À payer à la livraison"));
        var vendorIds = uniqueVendorIdsFromOrder(o);
        var reviewBtns = "";
        if (o.status === "livree") {
          reviewBtns = vendorIds.map(function (vid) {
            var vend = vendorById(vid);
            var already = state.data.reviews.some(function (r) { return r.orderId === o.id && r.vendorId === vid; });
            if (already) return '<div style="font-size:12px;color:var(--jade);margin-top:6px">✓ Avis envoyé pour ' + escapeHtml(vend ? vend.name : "") + '</div>';
            return '<button class="secondary-btn" style="width:auto;padding:7px 14px;margin-top:8px;font-size:12.5px" data-action="open-review" data-order="' + o.id + '" data-vendor="' + vid + '">⭐ Laisser un avis' + (vend ? " · " + escapeHtml(vend.name) : "") + '</button>';
          }).join("");
        }
        var codeBlock = "";
        if (o.deliveryCode && o.paymentStatus === "bloque") {
          codeBlock = '' +
          '<div class="delivery-code-box">' +
            '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Montre ce code (ou ce QR) au vendeur <strong>uniquement à la réception</strong> — il en a besoin pour débloquer le paiement.</div>' +
            '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
              '<div class="qr-box">' + qrSvgFor(o.id + ":" + o.deliveryCode) + '</div>' +
              '<div class="delivery-code-text">' + o.deliveryCode + '</div>' +
            '</div>' +
          '</div>';
        }
        return '' +
        '<div class="form-card" style="margin-bottom:12px">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
            '<div>' +
              '<div style="font-weight:700;font-size:14.5px">' + fmt(o.total || o.subtotal || 0) + '</div>' +
              '<div style="font-size:12.5px;color:var(--text-muted);margin-top:4px">' + escapeHtml(itemsTxt) + '</div>' +
              '<div style="font-size:12px;color:var(--text-muted);margin-top:6px">Livraison : ' + escapeHtml(o.address) + '</div>' +
              '<div style="font-size:12px;color:var(--jade);margin-top:6px;font-weight:600">' + payLabel + '</div>' +
            '</div>' +
            '<span class="status-pill ' + statusCls + '">' + statusLabel + '</span>' +
          '</div>' +
          codeBlock +
          reviewBtns +
        '</div>';
      }).join("");
    }

    return '' +
    '<div class="section" style="max-width:560px">' +
      '<button class="crumb" data-action="go-home">← Retour au marché</button>' +
      '<div class="section-head">' +
        '<div>' +
          '<div class="section-title" style="margin-bottom:4px">Mes commandes</div>' +
          '<div class="section-sub">Connecté en tant que <strong style="color:var(--amber)">' + escapeHtml(account.name) + '</strong></div>' +
        '</div>' +
        '<button class="secondary-btn" style="width:auto;padding:8px 16px;margin:0;color:var(--text-on-dark);border-color:rgba(243,239,227,0.4)" data-action="logout-client">Se déconnecter</button>' +
      '</div>' +
      '<div style="height:14px"></div>' +
      listHtml +
    '</div>';
  }

  function cartItemsResolved() {
    return state.cart.map(function (ci) {
      var p = productById(ci.productId);
      return p ? { productId: ci.productId, qty: ci.qty, vendorName: ci.vendorName, product: p } : null;
    }).filter(Boolean);
  }

  function renderVendorReviews(vendorId) {
    var reviews = state.data.reviews.filter(function (r) { return r.vendorId === vendorId; });
    if (reviews.length === 0) return "";
    var avg = reviews.reduce(function (s, r) { return s + r.rating; }, 0) / reviews.length;
    var avgStars = "★".repeat(Math.round(avg)) + "☆".repeat(5 - Math.round(avg));
    var cards = reviews.slice().reverse().map(function (r) {
      var stars = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
      return '' +
      '<div class="review-card">' +
        '<div class="review-head"><strong style="font-size:13px">' + escapeHtml(r.buyerName) + '</strong><span class="stars">' + stars + '</span></div>' +
        (r.comment ? '<div style="font-size:13px;color:var(--text-muted)">' + escapeHtml(r.comment) + '</div>' : '') +
      '</div>';
    }).join("");
    return '' +
    '<div class="section-title" style="font-size:19px;margin:28px 0 4px">Avis clients</div>' +
    '<div class="section-sub" style="margin-bottom:12px"><span class="stars">' + avgStars + '</span> ' + avg.toFixed(1) + '/5 · ' + reviews.length + ' avis</div>' +
    cards;
  }

  function renderCartDrawer() {
    var items = cartItemsResolved();
    var total = items.reduce(function (s, it) { return s + it.product.price * it.qty; }, 0);
    var body = items.length === 0
      ? '<div class="empty"><div class="display">Le panier est vide</div>Ajoute des articles depuis un stand pour commencer une commande.</div>'
      : items.map(function (it) {
          return '' +
          '<div class="cart-item">' +
            '<div class="cart-item-thumb">' + it.product.icon + '</div>' +
            '<div class="cart-item-info">' +
              '<div class="cart-item-name">' + escapeHtml(it.product.name) + '</div>' +
              '<div class="cart-item-vendor">' + escapeHtml(it.vendorName) + '</div>' +
              '<div class="qty-row">' +
                '<button class="qty-btn" data-action="qty" data-product="' + it.productId + '" data-delta="-1">−</button>' +
                '<span>' + it.qty + '</span>' +
                '<button class="qty-btn" data-action="qty" data-product="' + it.productId + '" data-delta="1">+</button>' +
              '</div>' +
            '</div>' +
            '<div class="cart-item-price">' + fmt(it.product.price * it.qty) + '</div>' +
          '</div>';
        }).join("");

    var footer = items.length > 0
      ? '<div class="cart-total-row"><span>Total</span><span>' + fmt(total) + '</span></div>' +
        '<button class="primary-btn" data-action="goto-checkout">Passer la commande</button>'
      : "";

    return '' +
    '<div class="overlay" data-action="close-cart-overlay">' +
      '<div class="drawer" onclick="event.stopPropagation()">' +
        '<div class="drawer-head">' +
          '<div class="drawer-title">Mon panier</div>' +
          '<button class="icon-btn" data-action="close-cart">✕</button>' +
        '</div>' +
        body + footer +
      '</div>' +
    '</div>';
  }

  function renderCheckout() {
    if (!state.currentClientAccountId) {
      return renderAuthGate("client");
    }
    var checkoutAccount = accountById(state.currentClientAccountId);
    if (!checkoutAccount) { state.currentClientAccountId = null; return renderAuthGate("client"); }
    if (!state.coName) state.coName = checkoutAccount.name;
    if (!state.coPhone) state.coPhone = checkoutAccount.phone;
    var items = cartItemsResolved();
    var subtotal = items.reduce(function (s, it) { return s + it.product.price * it.qty; }, 0);
    var pay = state.payMethod || "flooz";
    var isCash = pay === "cash";
    var fee = Math.round(subtotal * 0.02);
    var total = subtotal + fee;
    var payOptions = [
      { id: "flooz", icon: "📱", label: "Flooz", sub: "Mobile Money Moov Africa" },
      { id: "tmoney", icon: "📲", label: "TMoney", sub: "Mobile Money Togocom" },
      { id: "carte", icon: "💳", label: "Carte bancaire", sub: "Visa / Mastercard" },
      { id: "virement", icon: "🏦", label: "Virement", sub: "Banque locale" },
      { id: "cash", icon: "💵", label: "Espèces à la livraison", sub: "Payer quand la commande arrive" }
    ];
    var payHtml = '<div class="pay-grid">' + payOptions.map(function (op) {
      return '' +
      '<div class="pay-option ' + (pay === op.id ? "selected" : "") + '" data-action="set-pay" data-pay="' + op.id + '">' +
        '<div class="pay-icon">' + op.icon + '</div>' +
        '<div><div class="pay-label">' + op.label + '</div><div class="pay-sub">' + op.sub + '</div></div>' +
      '</div>';
    }).join("") + '</div>';

    var priceBreakdown = '' +
      '<div class="price-line"><span>Sous-total</span><span>' + fmt(subtotal) + '</span></div>' +
      '<div class="price-line"><span>Frais de service (2%)</span><span>' + fmt(fee) + '</span></div>' +
      '<div class="price-line total"><span>Total à payer</span><span>' + fmt(total) + '</span></div>';

    var escrowNote = isCash
      ? '<div class="escrow-banner">💵 Tu payes le prix du produit (' + fmt(subtotal) + ') en espèces au livreur à la réception. Les frais de service (' + fmt(fee) + ') se règlent maintenant par mobile money.</div>'
      : '<div class="escrow-banner">🔒 Paiement sécurisé — les fonds sont bloqués et reversés au vendeur seulement après confirmation croisée de la livraison (code remis au vendeur à la réception).</div>';

    var feeNetworkHtml = "";
    if (isCash) {
      var feeNet = state.cashFeeNetwork || "flooz";
      feeNetworkHtml = '' +
        '<div class="field-label">Payer les frais de service (' + fmt(fee) + ') maintenant via</div>' +
        '<div class="pay-grid">' +
          '<div class="pay-option ' + (feeNet === "flooz" ? "selected" : "") + '" data-action="set-cash-fee-network" data-pay="flooz">' +
            '<div class="pay-icon">📱</div><div><div class="pay-label">Flooz</div><div class="pay-sub">Mobile Money Moov Africa</div></div>' +
          '</div>' +
          '<div class="pay-option ' + (feeNet === "tmoney" ? "selected" : "") + '" data-action="set-cash-fee-network" data-pay="tmoney">' +
            '<div class="pay-icon">📲</div><div><div class="pay-label">TMoney</div><div class="pay-sub">Mobile Money Togocom</div></div>' +
          '</div>' +
        '</div>';
    }

    return '' +
    '<div class="section" style="max-width:560px">' +
      '<button class="crumb" data-action="back-to-cart">← Retour au panier</button>' +
      '<div class="section-title" style="margin-bottom:4px">Finaliser la commande</div>' +
      '<div class="section-sub" style="margin-bottom:18px">' + items.length + ' article' + (items.length > 1 ? "s" : "") + '</div>' +
      '<div class="form-card">' +
        '<div class="field-label">Nom complet</div>' +
        '<input class="field-input" id="co-name" placeholder="Ex. Ama Koffi" value="' + escapeHtml(state.coName || "") + '">' +
        '<div class="field-label">Téléphone</div>' +
        '<input class="field-input" id="co-phone" placeholder="Ex. 90 00 00 00" value="' + escapeHtml(state.coPhone || "") + '">' +
        '<div class="field-label">Adresse de livraison</div>' +
        '<input class="field-input" id="co-address" placeholder="Quartier, ville" value="' + escapeHtml(state.coAddress || "") + '">' +
        '<div class="field-label">Choisir le mode de paiement</div>' +
        payHtml +
        priceBreakdown +
        feeNetworkHtml +
        escrowNote +
        '<button class="primary-btn" data-action="confirm-order">🔒 Confirmer et payer · ' + fmt(total) + '</button>' +
      '</div>' +
    '</div>';
  }

  function chatsForVendorAndClient(vendorId, phone) {
    return state.data.chats.filter(function (c) { return c.kind !== "trainer" && c.vendorId === vendorId && c.clientPhone === phone; })[0];
  }
  function chatsForTrainerAndClient(trainerId, phone) {
    return state.data.chats.filter(function (c) { return c.kind === "trainer" && c.trainerId === trainerId && c.clientPhone === phone; })[0];
  }
  function chatById(id) {
    return state.data.chats.filter(function (c) { return c.id === id; })[0];
  }

  function humanFileSize(bytes) {
    if (!bytes) return "";
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " Ko";
    return (bytes / (1024 * 1024)).toFixed(1) + " Mo";
  }

  function renderMessageInner(m) {
    if (m.type === "audio") return { inner: '<audio controls src="' + m.audioData + '"></audio>', mediaBubble: false };
    if (m.type === "image") {
      return { inner: '<img class="msgr-media" src="' + m.fileData + '" data-action="open-lightbox" data-kind="image">', mediaBubble: true };
    }
    if (m.type === "video") {
      return { inner: '<video class="msgr-media" src="' + m.fileData + '" controls></video>', mediaBubble: true };
    }
    if (m.type === "file") {
      return {
        inner: '<a class="msgr-file-card" href="' + m.fileData + '" download="' + escapeHtml(m.fileName || "fichier") + '">' +
          '<div class="msgr-file-icon">📄</div>' +
          '<div><div class="msgr-file-name">' + escapeHtml(m.fileName || "Fichier") + '</div><div class="msgr-file-size">' + humanFileSize(m.fileSize) + '</div></div>' +
        '</a>',
        mediaBubble: false
      };
    }
    return { inner: escapeHtml(m.text), mediaBubble: false };
  }

  function renderChatDrawer() {
    var chat = state.activeChatId ? chatById(state.activeChatId) : null;
    var needsIdentity = state.chatRole === "client" && !chat && !(state.chatClientName && state.chatClientPhone);
    var isTrainerChat = chat ? chat.kind === "trainer" : state.chatPendingKind === "trainer";
    var peerName = "";
    var otherPhone = "";
    if (chat) {
      if (isTrainerChat) {
        var tt2 = trainerById(chat.trainerId);
        peerName = tt2 ? tt2.name : "";

            (!mine && !nextSame ? '<div class="msgr-avatar small">' + initials(peerName || "?") + '</div>' : (!mine ? '<div class="msgr-spacer"></div>' : "")) +
            '<div class="msgr-bubble-wrap"><div class="msgr-bubble' + (mi.mediaBubble ? " media-bubble" : "") + '">' + mi.inner + '</div></div>' +
          '</div>';

    var bodyHtml = '' +
      '<div class="msgr-body">' + msgsHtml + '</div>' +
      (state.recording ? '<div class="msgr-recording-note">● Enregistrement en cours… appuie sur ⏹ pour arrêter</div>' : '') +
      '<div class="msgr-inputbar">' +
        '<button class="msgr-attach-btn" data-action="pick-file" data-target="chat" title="Envoyer un fichier">📎</button>' +

    return '' +
    '<div class="msgr-overlay" data-action="close-chat-overlay">' +
      '<div class="msgr-panel" onclick="event.stopPropagation()">' +
        headerHtml +

    var myOrders = state.data.orders.filter(function (o) {
      return o.items.some(function (it) { return it.vendorId === VENDOR_ID; });

    var myChats = state.data.chats.filter(function (c) { return c.vendorId === VENDOR_ID; });

      '<div class="dash-tabs">' +

        '<button class="dash-tab ' + (state.dashTab === "messages" ? "active" : "") + '" data-action="dash-tab" data-tab="messages">Messages' + (myChats.length ? " (" + myChats.length + ")" : "") + '</button>' +

          myOrders.map(function (o) {

      '<div class="section-head">' +
        '<div>' +

          '<div style="font-size:12.5px;color:var(--text-muted)">' + escapeHtml(courier.vehicle) + ' · ' + escapeHtml(courier.zone) + (courier.plate ? " · " + escapeHtml(courier.plate) : "") + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<button class="' + (courier.status === "disponible" ? "primary-btn" : "secondary-btn") + '" style="width:auto;padding:10px 18px;margin:0" data-action="toggle-availability">' +

          '</button>' +
          '<button class="secondary-btn" style="width:auto;padding:10px 14px;margin:0;font-size:12.5px" data-action="logout-livreur">Se déconnecter</button>' +

      '</div>';

    body += '<div class="section-title" style="font-size:19px;margin:24px 0 12px">Demandes en attente</div>';

      body += '<div class="empty"><div class="display">Aucune demande en attente</div>Reviens plus tard.</div>';
    } else {
      body += '<table class="mytable"><thead><tr><th>Client</th><th>Trajet</th><th>Note</th><th></th></tr></thead><tbody>' +
        pending.map(function (r) {
          return '<tr><td>' + escapeHtml(r.name) + '<br><span style="color:var(--text-muted);font-size:12px">' + escapeHtml(r.phone) + '</span></td>' +
            '<td>' + escapeHtml(r.pickup) + ' → ' + escapeHtml(r.dropoff) + '</td>' +
            '<td>' + escapeHtml(r.note || "—") + '</td>' +

          var statusCls = r.status === "livree" ? "livree" : (r.status === "assignee" ? "confirmee" : "attente");
          var statusLabel = r.status === "livree" ? "Livrée" : (r.status === "assignee" ? "Livreur assigné" : "En attente");

            '<td><span class="status-pill ' + statusCls + '">' + statusLabel + '</span></td></tr>';

      '<div class="form-card" style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:14px">' +

        '<button class="primary-btn" data-action="add-course">Publier la formation</button>' +

    var myEnrollments = state.data.enrollments.filter(function (e) { return normPhone(e.studentPhone) === normPhone(account.phone); });

    var body = '';
    if (myEnrollments.length === 0) {
      body = '<div class="empty"><div class="display">Aucune inscription pour l\'instant</div>Inscris-toi à une formation depuis l\'onglet "Suivre une formation".</div>';
    } else {
      body = myEnrollments.slice().reverse().map(function (e) {
        var course = state.data.courses.filter(function (c) { return c.id === e.courseId; })[0];
        var trainer = course ? trainerById(course.trainerId) : null;

  var notifSnapshot = { chats: {}, groups: {}, orderStatus: {}, vendorOrderCount: 0, courierReqCount: 0, trainerEnrollCount: 0, initialized: false };

  function notifSupported() {
    return typeof Notification !== "undefined";
  }

  function fireNotification(title, body, tag) {
    if (!notifSupported() || Notification.permission !== "granted") return;
    try {
      var n = new Notification(title, { body: body, tag: tag, icon: undefined });
      n.onclick = function () { window.focus(); n.close(); };
    } catch (e) { /* certains navigateurs mobiles limitent les notifications JS directes */ }
  }

  function requestNotifPermission() {
    if (!notifSupported()) { showToast("Les notifications ne sont pas prises en charge sur ce navigateur"); return; }
    if (Notification.permission === "granted") { showToast("Notifications déjà activées"); startNotifPolling(); return; }
    Notification.requestPermission().then(function (perm) {
      if (perm === "granted") { showToast("Notifications activées 🔔"); startNotifPolling(); }
      else showToast("Notifications refusées");
      render();
    });
  }

  var notifPollingStarted = false;
  function startNotifPolling() {
    if (notifPollingStarted) return;
    notifPollingStarted = true;
    setInterval(checkForNotifications, 6000);
  }

  function checkForNotifications() {
    if (!notifSupported() || Notification.permission !== "granted") return;
    loadData().then(function (fresh) {
      var firstRun = !notifSnapshot.initialized;

      // messages in 1-1 chats relevant to whoever is logged in on this device
      fresh.chats.forEach(function (c) {
        var relevant =
          (state.currentClientAccountId && normPhone(c.clientPhone) === normPhone((accountByIdFrom(fresh, state.currentClientAccountId) || {}).phone || state.chatClientPhone)) ||
          (state.currentVendorAccountId && c.kind !== "trainer" && c.vendorId === (accountByIdFrom(fresh, state.currentVendorAccountId) || {}).vendorId) ||
          (state.currentTrainerId && c.kind === "trainer" && c.trainerId === state.currentTrainerId);
        if (!relevant) return;
        var prevCount = notifSnapshot.chats[c.id] || 0;
        if (c.messages.length > prevCount && !firstRun) {
          var last = c.messages[c.messages.length - 1];
          var isMine = (state.currentClientAccountId && last.from === "client" && normPhone(c.clientPhone) === normPhone(state.chatClientPhone)) ||
            (state.currentVendorAccountId && last.from === "vendeur") || (state.currentTrainerId && last.from === "formateur");
          if (!isMine) {
            fireNotification("💬 " + (c.clientName || "Nouveau message"), last.type ? "A envoyé une pièce jointe" : (last.text || "").slice(0, 80), "chat-" + c.id);
          }
        }
        notifSnapshot.chats[c.id] = c.messages.length;
      });

      // group messages
      fresh.groups.forEach(function (g) {
        var isTrainerHere = state.currentTrainerId === g.trainerId;
        var isEnrolledHere = state.currentClientAccountId && fresh.enrollments.some(function (e) {
          return e.courseId === g.courseId && normPhone(e.studentPhone) === normPhone(state.chatClientPhone);
        });
        if (!isTrainerHere && !isEnrolledHere) return;
        var prevCount = notifSnapshot.groups[g.id] || 0;
        if (g.messages.length > prevCount && !firstRun) {
          var last = g.messages[g.messages.length - 1];
          var isMine = last.senderRole === state.groupSenderRole && last.senderName === state.groupSenderName;
          if (!isMine) {
            fireNotification("👥 " + g.name, escapeHtml(last.senderName) + ": " + (last.type ? "pièce jointe" : (last.text || "").slice(0, 60)), "group-" + g.id);
          }
        }
        notifSnapshot.groups[g.id] = g.messages.length;
      });

      // new orders for the logged-in vendor
      if (state.currentVendorAccountId) {
        var vAcc = accountByIdFrom(fresh, state.currentVendorAccountId);
        if (vAcc) {
          var vOrders = fresh.orders.filter(function (o) { return o.items.some(function (it) { return it.vendorId === vAcc.vendorId; }); });
          if (!firstRun && vOrders.length > notifSnapshot.vendorOrderCount) {
            fireNotification("🛍️ Nouvelle commande", "Tu as reçu une nouvelle commande sur Woezon", "vendor-order");
          }
          notifSnapshot.vendorOrderCount = vOrders.length;
        }
      }

      // order status changes for the logged-in client
      if (state.currentClientAccountId) {
        var cAcc = accountByIdFrom(fresh, state.currentClientAccountId);
        if (cAcc) {
          var cOrders = fresh.orders.filter(function (o) { return normPhone(o.phone) === normPhone(cAcc.phone); });
          cOrders.forEach(function (o) {
            var prevStatus = notifSnapshot.orderStatus[o.id];
            if (prevStatus && prevStatus !== o.status && !firstRun) {
              var label = o.status === "livree" ? "livrée" : (o.status === "confirmee" ? "confirmée" : o.status);
              fireNotification("📦 Commande " + label, "Ta commande de " + fmt(o.total || 0) + " est maintenant " + label, "order-" + o.id);
            }
            notifSnapshot.orderStatus[o.id] = o.status;
          });
        }
      }

      // new pending delivery requests for the logged-in courier
      if (state.currentCourierId) {
        var pending = fresh.deliveryRequests.filter(function (r) { return r.status === "attente"; }).length;
        if (!firstRun && pending > notifSnapshot.courierReqCount) {
          fireNotification("🛵 Nouvelle demande de livraison", "Une course est disponible près de chez toi", "courier-req");
        }
        notifSnapshot.courierReqCount = pending;
      }

      // new enrollments for the logged-in trainer
      if (state.currentTrainerId) {
        var myCoursesIds = fresh.courses.filter(function (c) { return c.trainerId === state.currentTrainerId; }).map(function (c) { return c.id; });
        var myEnr = fresh.enrollments.filter(function (e) { return myCoursesIds.indexOf(e.courseId) !== -1; }).length;
        if (!firstRun && myEnr > notifSnapshot.trainerEnrollCount) {
          fireNotification("🎓 Nouvelle inscription", "Un élève vient de s'inscrire à l'une de tes formations", "trainer-enroll");
        }
        notifSnapshot.trainerEnrollCount = myEnr;
      }

      notifSnapshot.initialized = true;
    }).catch(function () {});
  }

  function accountByIdFrom(dataObj, id) {
    return dataObj.accounts.filter(function (a) { return a.id === id; })[0];
  }

  function showToast(msg) {
    state.toastMsg = msg;
    render();
    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(function () { state.toastMsg = null; render(); }, 2200);
  }

  function addToCart(productId) {
    var p = productById(productId);
    if (!p) return;
    var v = vendorById(p.vendorId);
    var existing = state.cart.filter(function (c) { return c.productId === productId; })[0];
    if (existing) existing.qty += 1;
    else state.cart.push({ productId: productId, qty: 1, vendorName: v ? v.name : "" });
    showToast("Ajouté au panier");
  }

  function updateQty(productId, delta) {
    var item = state.cart.filter(function (c) { return c.productId === productId; })[0];
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) state.cart = state.cart.filter(function (c) { return c.productId !== productId; });
    render();
  }

          state.enrollCourseId = el.getAttribute("data-course");
          render();
        }
        else if (action === "close-enroll") { state.enrollOpen = false; render(); }
        else if (action === "close-enroll-overlay") { if (e.target === el) { state.enrollOpen = false; render(); } }
        else if (action === "submit-enroll") { doSubmitEnroll(); }
        else if (action === "set-enroll-pay") { state.enrollPayMethod = el.getAttribute("data-pay"); render(); }
        else if (action === "open-review") {
          state.reviewOpen = true;
          state.reviewOrderId = el.getAttribute("data-order");
          state.reviewVendorId = el.getAttribute("data-vendor");
          state.reviewRating = 5;
          state.reviewComment = "";
          render();
        }
        else if (action === "close-review") { state.reviewOpen = false; render(); }
        else if (action === "close-review-overlay") { if (e.target === el) { state.reviewOpen = false; render(); } }
        else if (action === "set-rating") { state.reviewRating = parseInt(el.getAttribute("data-rating"), 10); render(); }
        else if (action === "submit-review") { doSubmitReview(); }
      });

      if (el.tagName === "SELECT" && el.getAttribute("data-action") === "set-status") {
        el.addEventListener("change", function () {
          doSetStatus(el.getAttribute("data-order"), el.value);
        });
      }
    });
  }

  function generateDeliveryCode() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var code = "";
    for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  function qrSvgFor(text) {
    try {
      var qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      return qr.createSvgTag(5, 4);
    } catch (e) {
      return "";
    }
  }

  // Retourne une promesse résolue avec la réponse de PayGate.
  function triggerPayGatePayment(identifier, phone, amount, description, network, table, kind) {
    return supabaseClient.functions.invoke("initiate-payment", {
      body: { identifier: identifier, phone: phone, amount: amount, description: description, network: network, table: table, kind: kind || "full" }
    }).then(function (res) {

  function doConfirmOrder() {
    if (!state.currentClientAccountId) { showToast("Connecte-toi d'abord pour commander"); render(); return; }
    if (!supabaseClient) { showToast("Connexion au serveur indisponible — réessaie plus tard"); return; }
    var name = (document.getElementById("co-name") || {}).value || "";
    var phone = (document.getElementById("co-phone") || {}).value || "";
    var address = (document.getElementById("co-address") || {}).value || "";
    if (!name.trim() || !phone.trim() || !address.trim()) {
      showToast("Remplis tous les champs pour continuer");
      return;
    }
    var items = cartItemsResolved();
    if (!items.length) { showToast("Ton panier est vide"); return; }
    var subtotal = items.reduce(function (s, it) { return s + it.product.price * it.qty; }, 0);
    var payMethod = state.payMethod || "flooz";
    var isCash = payMethod === "cash";
    var fee = Math.round(subtotal * 0.02);
    var total = subtotal + fee;
    var orderId = "o" + Date.now();
    var orderRow = {
      id: orderId, client_id: state.currentClientAccountId,
      client_name: name.trim(), client_phone: phone.trim(), address: address.trim(),
      pay_method: payMethod, subtotal: subtotal, fee: fee, total: total,
      payment_status: isCash ? "a_la_livraison" : "en_attente",
      fee_payment_status: isCash ? "en_attente" : null,
      delivery_code: isCash ? null : generateDeliveryCode(),
      status: "attente"
    };
    var itemRows = items.map(function (it, idx) {
      return {
        id: orderId + "-i" + idx, order_id: orderId, product_id: it.product.id,
        vendor_id: it.product.vendorId, name: it.product.name, price: it.product.price, qty: it.qty
      };
    });

    supabaseClient.from("orders").insert(orderRow).then(function (res) {
      if (res.error) throw res.error;
      return supabaseClient.from("order_items").insert(itemRows);
    }).then(function (res) {
      if (res.error) throw res.error;
      var order = {
        id: orderId, clientId: orderRow.client_id, name: orderRow.client_name, phone: orderRow.client_phone,
        address: orderRow.address, payMethod: orderRow.pay_method, subtotal: subtotal, fee: fee, total: total,
        paymentStatus: orderRow.payment_status, deliveryCode: orderRow.delivery_code, status: orderRow.status,
        createdAt: new Date().toISOString(),
        items: items.map(function (it) {
          return { productId: it.product.id, vendorId: it.product.vendorId, name: it.product.name, price: it.product.price, qty: it.qty };
        })
      };
      state.data.orders.push(order);
      state.cart = [];
      state.coName = ""; state.coPhone = ""; state.coAddress = "";
      state.view = { screen: "confirmation", order: order };
      render();

      if (isCash) {
        var feeNetwork = state.cashFeeNetwork || "flooz";
        triggerPayGatePayment("fee-" + orderId, phone.trim(), fee, "Frais de service Woezon " + orderId, feeNetwork, "order", "fee").then(function (payData) {
          if (String(payData.status) === "0") {
            showToast("📱 Vérifie ton téléphone pour valider les frais de service " + feeNetwork.toUpperCase());
          } else {
            showToast("Erreur lors du paiement des frais de service");
          }
        }).catch(function (e) {
          console.error(e);
          showToast("Erreur lors du paiement des frais de service");
        });
        return;
      }
      // Déclenche la vraie notification de paiement Flooz/TMoney
      triggerPayGatePayment(orderId, phone.trim(), total, "Commande Woezon " + orderId, payMethod, "order").then(function (payData) {
        if (String(payData.status) === "0") {
          showToast("📱 Vérifie ton téléphone pour valider le paiement " + payMethod.toUpperCase());
        } else {
          showToast("Erreur de paiement : réessaie ou choisis un autre mode");
        }
      }).catch(function (e) {
        console.error(e);
        showToast("Erreur lors du lancement du paiement, réessaie");
      });
    }).catch(function (e) {
      console.error(e);
      showToast("Erreur lors de la commande, réessaie");
      render();
    });
  }

    if (status === "livree" && current.paymentStatus === "a_la_livraison") patch.paymentStatus = "recu";

  function doSignup(role) {
    var name = ((document.getElementById("auth-name") || {}).value || "").trim();
    var email = ((document.getElementById("auth-email") || {}).value || "").trim();
    var phone = normPhone((document.getElementById("auth-phone") || {}).value);
    var password = (document.getElementById("auth-password") || {}).value || "";
    if (!name || !email || !phone || !password) { showToast("Remplis tous les champs"); return; }
    if (password.length < 6) { showToast("Le mot de passe doit faire au moins 6 caractères"); return; }
    if (!supabaseClient) { showToast("Connexion au serveur indisponible — réessaie plus tard"); return; }

    var extra = {};
    if (role === "vendeur") {
      extra.shopName = ((document.getElementById("auth-shopname") || {}).value || name).trim();
      extra.category = (document.getElementById("auth-category") || {}).value || CATEGORIES[0].id;
    } else if (role === "livreur") {
      extra.zone = ((document.getElementById("auth-zone") || {}).value || "").trim();
      extra.vehicle = (document.getElementById("auth-vehicle") || {}).value || VEHICLES[0];
      extra.plate = ((document.getElementById("auth-plate") || {}).value || "").trim();
      if (!extra.zone || !extra.plate) { showToast("Indique ta zone et ta plaque d'immatriculation"); return; }
    } else if (role === "formateur") {
      extra.domain = (document.getElementById("auth-domain") || {}).value || TRAINING_DOMAINS[0];
      extra.bio = ((document.getElementById("auth-bio") || {}).value || "").trim();
    }

    supabaseClient.auth.signUp({ email: email, password: password }).then(function (res) {
      if (res.error) { showToast(res.error.message || "Erreur à l'inscription"); render(); return; }
      var user = res.data.user;
      if (!user) { showToast("Vérifie ta boîte mail pour confirmer ton inscription, puis connecte-toi"); render(); return; }

      return supabaseClient.from("profiles").insert({ id: user.id, role: role, name: name, phone: phone }).then(function (profRes) {
        if (profRes.error) throw profRes.error;
        var account = { id: user.id, role: role, name: name, phone: phone };
        var roleInsert = Promise.resolve();

        if (role === "vendeur") {
          var vendorId = "v" + Date.now();
          roleInsert = supabaseClient.from("vendors").insert({ id: vendorId, owner_id: user.id, name: extra.shopName, category: extra.category, rating: 5, phone: phone }).then(function (r) {
            if (r.error) throw r.error;
            account.vendorId = vendorId;
            state.data.vendors.push({ id: vendorId, name: extra.shopName, category: extra.category, rating: 5, phone: phone });
          });
        } else if (role === "livreur") {
          var courierId = "c" + Date.now();
          roleInsert = supabaseClient.from("couriers").insert({ id: courierId, owner_id: user.id, name: name, phone: phone, zone: extra.zone, vehicle: extra.vehicle, plate: extra.plate, status: "disponible" }).then(function (r) {
            if (r.error) throw r.error;
            account.courierId = courierId;
            state.data.couriers.push({ id: courierId, name: name, phone: phone, zone: extra.zone, vehicle: extra.vehicle, plate: extra.plate, status: "disponible" });
          });
        } else if (role === "formateur") {
          var trainerId = "t" + Date.now();
          roleInsert = supabaseClient.from("trainers").insert({ id: trainerId, owner_id: user.id, name: name, phone: phone, domain: extra.domain, bio: extra.bio }).then(function (r) {
            if (r.error) throw r.error;
            account.trainerId = trainerId;
            state.data.trainers.push({ id: trainerId, name: name, phone: phone, domain: extra.domain, bio: extra.bio });
          });
        }

        return roleInsert.then(function () {
          applyAccountToState(account);
          saveData(state.data);
          showToast("Compte créé, bienvenue " + account.name + " !");
          render();
        });
      });
    }).catch(function (e) {
      console.error(e);
      showToast("Erreur : " + (e && e.message ? e.message : "impossible de créer le compte"));
      render();
    });
  }

      price: price, fee: fee, total: price + fee

        payMethod: payMethod, price: price, fee: fee, total: price + fee,
